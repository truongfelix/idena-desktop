name: Run E2E tests

on: [pull_request]

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Setup xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb

      - name: Install pinned Electron binary
        run: node node_modules/electron/install.js

      - name: Configure Electron sandbox
        run: |
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
          test "$(stat -c %u node_modules/electron/dist/chrome-sandbox)" = 0
          test "$(stat -c %a node_modules/electron/dist/chrome-sandbox)" = 4755

      - name: Run xvfb
        run: |
          npm run build
          xvfb-run -a npm run e2e
